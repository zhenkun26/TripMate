services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      # 从 backend/.env 读取 AMAP_API_KEY / LLM_API_KEY 等密钥（不存在则依赖下方默认值）
      - path: backend/.env
        required: false
    environment:
      # 容器网络内 Redis 地址（覆盖 .env 中的 127.0.0.1）
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
